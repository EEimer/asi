<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASI – YouTube Summaries</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png" />
  <!-- SVG zuletzt: Browser, die es koennen, nehmen es und rendern in jeder Groesse scharf -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
  <!-- Theme vor dem ersten Paint setzen. Ohne das blitzt die helle Seite auf, bevor
       das JS-Bundle geladen ist. Muss der Logik in src/store/themeStore.ts folgen. -->
  <script>
    try {
      var t = localStorage.getItem('asi_theme')
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      if (t === 'dark') document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
</head>
<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
